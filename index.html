<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>한국사 상식퀴즈 20문제</title>
<style>
  :root{
    --bg:#f6f7fb;
    --card:#ffffff;
    --text:#1f2937;
    --muted:#6b7280;
    --accent:#2563eb;
    --ok:#15803d;
    --bad:#b91c1c;
    --border:#e5e7eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{
    max-width:850px;
    margin:0 auto;
    padding:24px 16px 60px;
  }
  header{
    text-align:center;
    margin-bottom:24px;
  }
  h1{font-size:2rem;margin:.2rem 0}
  .sub{color:var(--muted);margin-top:8px}
  .progress{
    position:sticky;
    top:0;
    z-index:5;
    background:rgba(246,247,251,.95);
    backdrop-filter: blur(6px);
    padding:10px 0 14px;
    margin-bottom:10px;
  }
  .bar{
    height:10px;
    background:#e5e7eb;
    border-radius:999px;
    overflow:hidden;
  }
  .bar > div{
    height:100%;
    width:0%;
    background:var(--accent);
    transition:width .2s ease;
  }
  .q{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:20px;
    margin:16px 0;
    box-shadow:0 4px 18px rgba(0,0,0,.04);
  }
  .q h2{
    font-size:1.08rem;
    line-height:1.5;
    margin:0 0 14px;
  }
  .opt{
    display:block;
    border:1px solid var(--border);
    border-radius:12px;
    padding:12px 14px;
    margin:8px 0;
    cursor:pointer;
    transition:.15s ease;
  }
  .opt:hover{border-color:#93c5fd;background:#eff6ff}
  .opt input{margin-right:9px}
  .explain{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:10px;
    background:#f9fafb;
    color:#374151;
    line-height:1.55;
  }
  .explain.show{display:block}
  .correct{border-color:#86efac;background:#f0fdf4}
  .wrong{border-color:#fca5a5;background:#fef2f2}
  .actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    justify-content:center;
    margin-top:28px;
  }
  button{
    border:none;
    border-radius:12px;
    padding:13px 20px;
    font-weight:700;
    cursor:pointer;
    font-size:1rem;
  }
  #grade{background:var(--accent);color:#fff}
  #reset{background:#111827;color:#fff}
  #result{
    display:none;
    margin-top:26px;
    background:#111827;
    color:white;
    border-radius:18px;
    padding:24px;
    text-align:center;
  }
  #result.show{display:block}
  #score{
    font-size:2rem;
    font-weight:800;
    margin:6px 0 8px;
  }
  .tiny{font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>한국사 상식퀴즈 20문제</h1>
    <div class="sub">성인용 난이도 · 객관식 4지선다 · 제출 후 정답과 설명 확인</div>
  </header>

  <div class="progress">
    <div class="tiny" id="progressText">0 / 20 응답</div>
    <div class="bar"><div id="progressBar"></div></div>
  </div>

  <form id="quiz"></form>

  <div class="actions">
    <button type="button" id="grade">정답 제출</button>
    <button type="button" id="reset">다시 풀기</button>
  </div>

  <div id="result">
    <div>최종 점수</div>
    <div id="score"></div>
    <div id="comment"></div>
  </div>
</div>

<script>
const qs = [
{
q:"고조선을 건국했다고 전해지는 인물은 누구일까요?",
o:["단군왕검","주몽","박혁거세","온조"], a:0,
e:"『삼국유사』 등에 따르면 단군왕검이 고조선을 건국했다고 전해집니다. 전통적으로 건국 연대는 기원전 2333년으로 알려져 있습니다."
},
{
q:"삼국 중 가장 먼저 한강 유역을 차지하며 전성기를 맞은 나라는 어디일까요?",
o:["고구려","백제","신라","가야"], a:1,
e:"백제는 한강 유역을 기반으로 성장했고 근초고왕 때 전성기를 맞았습니다. 이후 고구려 장수왕, 신라 진흥왕이 한강 유역을 차지했습니다."
},
{
q:"고구려의 전성기를 이끌며 영토를 크게 넓힌 왕은 누구일까요?",
o:["광개토대왕","무령왕","진흥왕","성왕"], a:0,
e:"광개토대왕은 고구려 영토를 크게 확장한 왕입니다. 그의 정복 활동과 업적은 광개토대왕릉비에 기록되어 있습니다."
},
{
q:"신라가 삼국 통일 과정에서 동맹을 맺은 나라는 어디일까요?",
o:["수","당","원","명"], a:1,
e:"신라는 당나라와 나당연합을 맺어 660년 백제, 668년 고구려를 멸망시키는 데 성공했습니다."
},
{
q:"통일신라 시대에 불국사와 석굴암이 조성된 시기의 왕은 누구일까요?",
o:["신문왕","경덕왕","문무왕","진성여왕"], a:1,
e:"불국사와 석굴암은 통일신라 경덕왕 때 김대성이 조성을 시작한 것으로 전해지며, 통일신라 불교문화의 대표 유산입니다."
},
{
q:"고려를 건국한 인물은 누구일까요?",
o:["왕건","궁예","견훤","최영"], a:0,
e:"왕건은 918년 고려를 건국했고, 936년 후삼국을 통일했습니다. 고려의 초대 왕으로 태조 왕건이라 부릅니다."
},
{
q:"고려 시대에 거란의 침입을 막는 데 활약한 장군은 누구일까요?",
o:["강감찬","이성계","김유신","권율"], a:0,
e:"강감찬은 고려 현종 때 거란의 제3차 침입을 막았고, 1019년 귀주대첩에서 큰 승리를 거뒀습니다."
},
{
q:"고려가 몽골 침입에 맞서 수도를 옮긴 곳은 어디일까요?",
o:["제주도","강화도","진도","거제도"], a:1,
e:"고려는 몽골 기병의 공격을 피하고 장기 항전을 위해 1232년 수도를 개경에서 강화도로 옮겼습니다."
},
{
q:"조선을 건국한 인물은 누구일까요?",
o:["정도전","이성계","이방원","최영"], a:1,
e:"이성계는 위화도 회군 이후 정치적 주도권을 잡고 1392년 조선을 건국해 초대 왕 태조가 되었습니다."
},
{
q:"훈민정음을 창제한 조선의 왕은 누구일까요?",
o:["태종","세종","세조","성종"], a:1,
e:"세종은 백성이 쉽게 글을 쓰고 읽을 수 있도록 훈민정음을 창제했습니다. 1443년 창제, 1446년 반포가 핵심 연도입니다."
},
{
q:"임진왜란이 시작된 해는 언제일까요?",
o:["1592년","1600년","1636년","1453년"], a:0,
e:"임진왜란은 1592년에 시작됐습니다. 이후 정유재란까지 이어져 1598년에 끝났습니다."
},
{
q:"임진왜란 당시 한산도대첩을 이끈 장군은 누구일까요?",
o:["이순신","권율","곽재우","김시민"], a:0,
e:"이순신은 1592년 한산도대첩에서 조선 수군을 지휘해 일본 수군을 크게 격파했습니다."
},
{
q:"조선 후기 정조가 건설한 성곽은 무엇일까요?",
o:["남한산성","수원 화성","북한산성","공산성"], a:1,
e:"정조는 아버지 사도세자의 능을 수원으로 옮긴 뒤 수원 화성을 건설했습니다. 정약용과 거중기도 함께 자주 언급됩니다."
},
{
q:"조선 후기 대동법 시행을 확대하는 데 크게 기여한 인물은 누구일까요?",
o:["김육","조광조","송시열","김정호"], a:0,
e:"김육은 대동법 확대 시행을 적극 추진했습니다. 대동법은 공납의 폐단을 줄이고 쌀·포·동전 등으로 납부하게 한 제도입니다."
},
{
q:"흥선대원군이 집권기에 추진한 정책으로 옳은 것은 무엇일까요?",
o:["서원 대폭 정리","과거제 폐지","한글 전용 정책","신분제 완전 폐지"], a:0,
e:"흥선대원군은 왕권 강화와 국가 재정 확보를 위해 전국의 서원을 대폭 정리했습니다."
},
{
q:"강화도조약이 체결된 해는 언제일까요?",
o:["1866년","1876년","1882년","1894년"], a:1,
e:"강화도조약은 1876년 조선과 일본 사이에 체결되었습니다. 최초의 근대적 조약으로 평가되지만 일본에 유리한 불평등 조약이었습니다."
},
{
q:"동학농민운동에서 농민군을 이끈 대표적인 지도자는 누구일까요?",
o:["전봉준","안중근","김구","윤봉길"], a:0,
e:"전봉준은 1894년 동학농민운동의 대표 지도자이며 '녹두장군'이라는 별명으로도 잘 알려져 있습니다."
},
{
q:"1919년 3·1운동 이후 수립된 정부는 무엇일까요?",
o:["대한민국 임시정부","대한제국","통감부","조선총독부"], a:0,
e:"3·1운동 이후 독립운동 세력을 통합하기 위해 1919년 중국 상하이에서 대한민국 임시정부가 수립되었습니다."
},
{
q:"이토 히로부미를 하얼빈에서 저격한 독립운동가는 누구일까요?",
o:["안중근","윤봉길","김좌진","유관순"], a:0,
e:"안중근 의사는 1909년 하얼빈역에서 이토 히로부미를 저격했습니다. 이후 동양평화론을 집필하기도 했습니다."
},
{
q:"대한민국 정부가 수립된 해는 언제일까요?",
o:["1945년","1948년","1950년","1953년"], a:1,
e:"대한민국 정부는 1948년 8월 15일 수립되었습니다. 광복은 1945년 8월 15일이므로 두 날짜를 구분하는 것이 중요합니다."
}
];

const quiz = document.getElementById("quiz");
qs.forEach((x,i)=>{
  const sec=document.createElement("section");
  sec.className="q";
  sec.innerHTML=`<h2>${i+1}. ${x.q}</h2>` +
    x.o.map((v,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}">${String.fromCharCode(65+j)}. ${v}</label>`).join("") +
    `<div class="explain" id="e${i}"></div>`;
  quiz.appendChild(sec);
});

function updateProgress(){
  let c=0;
  qs.forEach((_,i)=>{ if(document.querySelector(`input[name="q${i}"]:checked`)) c++; });
  document.getElementById("progressText").textContent=`${c} / ${qs.length} 응답`;
  document.getElementById("progressBar").style.width=`${c/qs.length*100}%`;
}
document.addEventListener("change", updateProgress);

document.getElementById("grade").addEventListener("click",()=>{
  let score=0;
  qs.forEach((x,i)=>{
    const picked=document.querySelector(`input[name="q${i}"]:checked`);
    const labels=[...document.querySelectorAll(`input[name="q${i}"]`)].map(el=>el.parentElement);
    labels.forEach(l=>l.classList.remove("correct","wrong"));
    labels[x.a].classList.add("correct");
    const ex=document.getElementById(`e${i}`);
    if(!picked){
      ex.innerHTML=`<b>정답: ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}</b><br>${x.e}`;
    }else{
      const val=Number(picked.value);
      if(val===x.a){
        score++;
        ex.innerHTML=`<b>정답!</b> ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}<br>${x.e}`;
      }else{
        picked.parentElement.classList.add("wrong");
        ex.innerHTML=`<b>오답.</b> 정답은 ${String.fromCharCode(65+x.a)}. ${x.o[x.a]}<br>${x.e}`;
      }
    }
    ex.classList.add("show");
  });

  const r=document.getElementById("result");
  document.getElementById("score").textContent=`${score} / ${qs.length}점`;
  let comment="";
  if(score<=7) comment="한국사 다시 시작해야 함 😂";
  else if(score<=12) comment="기본 상식 보유 👍";
  else if(score<=16) comment="한국사 꽤 잘함 😎";
  else if(score<=19) comment="한국사 고수 🔥";
  else comment="20점 만점! 역사 선생님 의심해봐야 함 ㅋㅋ";
  document.getElementById("comment").textContent=comment;
  r.classList.add("show");
  r.scrollIntoView({behavior:"smooth",block:"center"});
});

document.getElementById("reset").addEventListener("click",()=>{
  document.getElementById("quiz").reset();
  document.querySelectorAll(".opt").forEach(x=>x.classList.remove("correct","wrong"));
  document.querySelectorAll(".explain").forEach(x=>x.classList.remove("show"));
  document.getElementById("result").classList.remove("show");
  updateProgress();
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
